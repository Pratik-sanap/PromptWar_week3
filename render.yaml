# render.yaml - Render Blueprint Specification for Backend Deployment
# Reference: https://render.com/docs/blueprints

services:
  - type: web
    name: stadium-concierge-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render Dashboard or during creation
      - key: ALLOWED_ORIGINS
        value: "*" # Set to your Vercel URL once deployed to restrict CORS
